name: hapiq-data
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - go
  - pip:
      # thoa's builder solves with bioconda ahead of conda-forge under strict
      # priority, which breaks h5py/hdf5 (c-ares); pip wheels avoid conda for them.
      - anndata
      - scipy
      - pandas
      - pyyaml
      # hapiq with lock support (btraven00/hapiq feat/remotes d9fe923), built
      # from source by its hatch hook with `go`; a source archive needs no git.
      - hapiq @ https://github.com/btraven00/hapiq/archive/d9fe923.tar.gz#subdirectory=python
