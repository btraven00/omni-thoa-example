name: hapiq-data
channels:
  - conda-forge
dependencies:
  - python=3.12
  - anndata
  - scipy
  - pandas
  - pyyaml
  - pip
  - pip:
      # ponytail: hapiq built from btraven00/hapiq feat/remotes (lock support);
      # switch to a PyPI pin once a release carries `hapiq lock`.
