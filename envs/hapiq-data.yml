name: hapiq-data
channels:
  - conda-forge
dependencies:
  - python=3.12
  - anndata
  - scipy
  - pandas
  - pyyaml
  - go
  - git
  - pip
  - pip:
      # hapiq with lock support (btraven00/hapiq feat/remotes d9fe923), built from
      # source by its hatch hook, which needs `go`. Switch to a PyPI pin once
      # a release carries `hapiq lock`.
      - hapiq @ git+https://github.com/btraven00/hapiq@d9fe923#subdirectory=python
