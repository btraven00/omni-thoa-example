name: env
channels:
- bioconda
- conda-forge
- https://prefix.dev/almost-conductor
- nodefaults
dependencies:
- bioconductor-anndatar *
- bioconductor-biocsingular *
- bioconductor-delayedarray *
- bioconductor-hdf5array *
- bioconductor-rhdf5 *
- bioconductor-scrapper *
- bioconductor-singlecellexperiment *
- pip
- python=3.12
- r-argparser *
- r-base >=4.5
- r-data.table *
- r-jsonlite *
- r-matrix *
- r-yaml *
- pip:
  - PyYAML
  - click>=8.1.7
  - copier>=9.0.0
  - dulwich>=0.22.0
  - filelock>=3.4.0
  - humanfriendly
  - pathspec>=0.12.0
  - pydantic
  - pydot>=3.0.2
  - python-dateutil>=2.9.0.post0
  - python-dotenv>=1.0.0
  - rich>=13.0.0
  - snakemake>=9.0
  - spdx-license-list>=3.19
  - tqdm>=4.66.4
