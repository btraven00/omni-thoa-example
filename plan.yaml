id: omni_thoa_example
name: omni-thoa-example
description: >
  A slice of omni-scrna/split-stages-plan (DATA, FILT, NORM and FEAT with
  one module each, PCA with three) whose DATA stage fetches through hapiq,
  from the thoa data lake when hapiq.lock pins the dataset.
benchmarker: "ben <ben.uzh@proton.me>"
version: "0.1.0"
# Named outputs: every module gets --output id=PATH (omnibenchmark
# feat/named-outputs, design 009); ids are [A-Za-z0-9_].
api_version: "0.8.0"

provenance:
  derived_from: split_stages_plan
  canonical_url: https://raw.githubusercontent.com/btraven00/omni-thoa-example/refs/heads/main/plan.yaml

software_backend: "conda"

software_environments:
  hapiq_data:
    name: hapiq + anndata (python)
    conda: envs/hapiq-data.yml
  scrapper:
    name: scrapper multi-module
    conda: envs/scrapper.yml
  scanpy:
    name: scanpy multi-module
    conda: envs/scanpy.yml
  report:
    name: quarto + pandas
    conda: envs/report.yml

stages:
  - id: DATA
    outputs:
      - id: rawdata_h5ad
        path: "{module.id}.h5ad"
      - id: rawdata_clusters_truth
        path: "{module.id}.clusters_truth.tsv"
      - id: rawdata_clusters_truth_num
        path: "{module.id}.clusters_truth_num.txt"
      - id: properties_info
        path: "{module.id}_properties.yaml"
    modules:
      - id: be1
        name: "be1 (GEO GSE243665) via hapiq"
        software_environment: hapiq_data
        repository:
          url: https://github.com/btraven00/omni-thoa-example
          commit: 466661e # modules/ of this repo
          entrypoint: data_hapiq
        parameters:
          - dataset_name: be1
            batch_var: Sample
            labels_var: clusters.truth
            sample_var: Sample

  - id: FILT
    inputs:
      - rawdata_h5ad
      - properties_info
    outputs:
      - id: filtered_cellids
        path: "{module.id}_cellids.txt.gz"
      - id: filtered_featureids
        path: "{module.id}_featureids.txt.gz"
      - id: size_factor_tsv
        path: "{module.id}_size_factors.tsv"
    modules:
      - id: fi_scrapper
        name: "scrapper-style filtering"
        software_environment: scrapper
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 2a83f79  # api-0.8.0: --output id=PATH
          entrypoint: filter

  # NORM and FEAT: split-stages-plan api-0.8.0's contracts, scrapper only.
  # fe_scrapper's `requires: {runs_feat: "yes"}` is left out: nothing here
  # provides it.
  - id: NORM
    inputs:
      - rawdata_h5ad
      - filtered_cellids
      - filtered_featureids
    outputs:
      - id: normalized_h5
        path: "{module.id}_normalized.h5"
    modules:
      - id: nr_scrapper
        name: "scrapper-based normalization"
        software_environment: scrapper
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 2a83f79  # api-0.8.0: --output id=PATH
          entrypoint: normalize

  - id: FEAT
    inputs:
      - rawdata_h5ad
      - normalized_h5
      - filtered_cellids
      - filtered_featureids
      - properties_info
    outputs:
      - id: normalized_selected_h5
        path: "{module.id}_normalized_selected.h5"
    modules:
      - id: fe_scrapper
        name: "scrapper-based gene selection"
        software_environment: scrapper
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 2a83f79  # api-0.8.0: --output id=PATH
          entrypoint: select
        parameters:
          - number_selected: 2000

  # Three PCA modules, four runs; scanpy and scrapper envs, both built in the job.
  - id: PCA
    inputs:
      - normalized_selected_h5
    outputs:
      - id: embedding_tsv
        path: "{module.id}_embedding.tsv"
      - id: loadings_tsv
        path: "{module.id}_loadings.tsv"
    resources:
      cores: 4
    modules:
      - id: pc_scanpy
        name: "scanpy PCA, sparse arpack and dense randomized"
        software_environment: scanpy
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 754052a  # api-0.8.0
          entrypoint: pca
        parameters:
          - solver: [arpack]
            dense: "false"
            n_components: 50
            random_seed: 42
          - solver: [randomized]
            dense: "true"
            n_components: 50
            random_seed: 42
      - id: pc_exact
        name: "scanpy PCA, exact (full SVD, float64): the reference"
        software_environment: scanpy
        repository:
          url: https://github.com/omni-scrna/scanpy
          commit: 754052a  # api-0.8.0
          entrypoint: pca
        parameters:
          - solver: full
            dense: "true"
            dtype: float64
            n_components: 50
            random_seed: 42
      - id: pc_scrapper
        name: "scrapper PCA (irlba)"
        software_environment: scrapper
        repository:
          url: https://github.com/omni-scrna/scrapper
          commit: 2a83f79  # api-0.8.0
          entrypoint: pca
        parameters:
          - solver: [irlba]
            n_components: 50
            random_seed: 42

  # One report per dataset: gathers every DATA and FILT result of that dataset.
  - id: REPORT
    gather:
      - from: rawdata_clusters_truth
        group_by: DATA
      - from: filtered_cellids
        group_by: DATA
      - from: filtered_featureids
        group_by: DATA
    outputs:
      - id: report_html
        path: "{DATA}_report.html"
    modules:
      # TODO there's a generic quarto report, check obcommons
      - id: report_quarto
        name: "Quarto report: cells and genes kept by FILT"
        software_environment: report
        repository:
          url: https://github.com/btraven00/omni-thoa-example
          commit: 466661e # modules/ of this repo
          entrypoint: report
